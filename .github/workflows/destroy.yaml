name: Destroy - Terraform

on:
  workflow_dispatch:

jobs:
  destroy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}"
            }

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.12.2

      - name: Create Terraform variables
        run: |
          printf '%s\n' '${{ secrets.TFVARS }}' > terraform.tfvars

      - name: Main Init
        working-directory: .
        run: terraform init -upgrade

      - name: Destroy main infrastructure
        env:
          TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
        working-directory: .
        run: terraform destroy -auto-approve -input=false

      - name: Bootstrap Init
        working-directory: ./bootstrap
        run: terraform init -upgrade

      - name: Import Bootstrap Resource Group
        working-directory: ./bootstrap
        run: terraform import azurerm_resource_group.tfstate "/subscriptions/${{ secrets.AZURE_SUBSCRIPTION_ID }}/resourceGroups/rg-tfstate"

      - name: Import Bootstrap Storage Account
        working-directory: ./bootstrap
        run: terraform import azurerm_storage_account.tfstate "/subscriptions/${{ secrets.AZURE_SUBSCRIPTION_ID }}/resourceGroups/rg-tfstate/providers/Microsoft.Storage/storageAccounts/storage9972007"

      - name: Import Bootstrap Storage Container
        working-directory: ./bootstrap
        run: terraform import azurerm_storage_container.tfstate "https://storage9972007.blob.core.windows.net/tfstate"

      - name: Destroy Bootstrap
        working-directory: ./bootstrap
        run: terraform destroy -auto-approve -input=false